# Codex CLI MCP configuration snippet.
# Merge into ~/.codex/config.toml (create the file if it does not exist).
# Replace <PACK_ROOT> with your absolute path to this pack.

[mcp_servers.ansys-fluent]
command = '<PACK_ROOT>\.venv\Scripts\ansys-fluent-mcp.exe'
args = []
cwd = '<PACK_ROOT>'
startup_timeout_sec = 45
tool_timeout_sec = 600

[mcp_servers.ansys-fluent.env]
FLUIDS_MCP_LOG_LEVEL = "INFO"
FLUIDS_MCP_MAX_STEPS = "30"
